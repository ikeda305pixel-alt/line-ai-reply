plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.antigravity.lineaireply'
    compileSdk 34

    defaultConfig {
        applicationId "com.antigravity.lineaireply"
        minSdk 26
        targetSdk 34
        versionCode 31
        versionName "1.9.5"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        fixedKey {
            storeFile file("release.keystore")
            storePassword "lineaireplypass"
            keyAlias "lineaireply"
            keyPassword "lineaireplypass"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixedKey
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixedKey
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Coroutines & OkHttp for Gemini Free Tier API
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
