name: Build Line AI Reply APK

on:
  push:
    branches:
      - main
      - feat/*
  workflow_dispatch:

jobs:
  build:
    name: Build Line AI Reply APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build with Gradle
        run: |
          gradle assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply.apk
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply-v1.9.3.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: line-ai-reply.apk
          path: app/build/outputs/apk/release/line-ai-reply.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.9.3
          name: LINE & Bumble AI Reply Assistant v1.9.3 (バブル表示障害完全解消・Android 14/15 FGS specialUse安全起動・ContextThemeWrapper適用)
          body: |
            ## LINE & Bumble AI返信アシスタント v1.9.3

            ### 💬 【バブル・下部バー表示障害の根本解消】
            - **Pixel高解像度画面での画面外はみ出しバグ修正**: 従来固定pxで計算されていたバブルの初期座標を、画面密度（dp）およびView幅の実測に基づいて画面右端から16dp内側に正確にドッキングするように修正。
            - **Serviceコンテキストのテーマ不整合（Theme.MaterialComponents）クラッシュ防止**: オーバーレイUI展開時に `ContextThemeWrapper(context, R.style.Theme_LineAiReply)` を適用し、ボタンコンポーネントのテーマ依存例外を根絶。
            - **Android 14/15 FGS specialUse 安全起動**: `ServiceCompat.startForeground` に `ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE` を正式指定し、`MissingForegroundServiceTypeException` による起動直後クラッシュを二重防御。
            - **バブル起動ボタンの復帰保証**: ボタン押下時に `enable_floating_bubble = true` を強制し、既存バブルが存在する場合も確実に最前面・可視状態へ引き戻すロジックを追加。

            ### 🔑 【Google AI Studio最新キー「AQ.」＆ Gemini 3系対応】
            - `AQ.Ab8RN...` 形式の最新Authentication Keyを完全サポート。
            - `gemini-3-flash-preview` への優先自動ルーティング（応答速度約1.0秒）。
            - 「ざっくばらん（自然体・本音共感）」トーン、神奈川限定ルール、MediaProjection完全撤去を100%維持。

            ### 🔒 【固定署名キーストアによる直接「更新」】
            - 固定キーストア署名（release.keystore）のため、アンインストール不要でそのまま「更新」可能です。
          files: |
            app/build/outputs/apk/release/line-ai-reply.apk
            app/build/outputs/apk/release/line-ai-reply-v1.9.3.apk

          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

