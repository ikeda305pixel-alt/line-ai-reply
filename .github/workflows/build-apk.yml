name: Build Line AI Reply APK

on:
  push:
    branches:
      - main
      - feat/*
  workflow_dispatch:

jobs:
  build:
    name: Build Line AI Reply APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Run Unit Tests & Build Release APK
        run: |
          gradle testDebugUnitTest --stacktrace
          gradle assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply.apk
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply-v2.0.5.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: line-ai-reply.apk
          path: app/build/outputs/apk/release/line-ai-reply.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.5
          name: LINE & Bumble AI Reply Assistant v2.0.5 (会話全体文脈理解＆未返信連投まとめ返信対応)
          body: |
            ## LINE & Bumble AI返信アシスタント v2.0.5 (Full Context & Unreplied Batch Reply)

            ### 💬 1. スクショ会話全体の文脈理解 ＆ 未返信連投まとめ返信
            - **会話全体の流れ・温度感の把握**: 従来プロンプトの「過去ログ無視」という過剰制約を撤廃し、画面全体（上から下への時系列）から話題の前提・関係性・温度感を正確に読み取るように刷新。
            - **未返信の連投メッセージすべてに返信**: 「自分の最後の送信（右側）より後に来ている、まだ自分が返していない相手（左側）のメッセージすべて」を返信対象と定義。相手が2〜3回に分けて連投してきた場合でも、最後の1文だけでなく未返信の連投すべてをまとめて受け止めて自然な返信案を生成。
            - **蒸し返し＆自己返信防止**: すでに返信済みの古い話題の蒸し返しを避け、画面最下部が自分の送信で終わっている場合は自然な追撃・フォローを提案。

            ### ⚡ 2. v2.0.4 爆速化＆QA品質の完全継承
            - 2026年最新最速モデル（`gemini-3.5-flash-lite` 等）・`thinkingConfig` 遅延ゼロ化・スクショ先読みプリキャッシュ・OkHttp接続プール共有＆TLSプリウォームを維持。

            ### 🔒 【固定署名キーストアによる直接「更新」】
            - 固定キーストア署名（release.keystore）のため、アンインストール不要でそのまま「更新」可能です。
          files: |
            app/build/outputs/apk/release/line-ai-reply.apk
            app/build/outputs/apk/release/line-ai-reply-v2.0.5.apk

          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

