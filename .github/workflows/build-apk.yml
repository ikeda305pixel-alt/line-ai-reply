name: Build Line AI Reply APK

on:
  push:
    branches:
      - main
      - feat/*
  workflow_dispatch:

jobs:
  build:
    name: Build Line AI Reply APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build with Gradle
        run: |
          gradle assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply.apk
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply-v1.9.4.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: line-ai-reply.apk
          path: app/build/outputs/apk/release/line-ai-reply.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.9.4
          name: LINE & Bumble AI Reply Assistant v1.9.4 (爆速1.0秒化・画面最下部最新メッセージ高精度認識・トップドックバー＆折りたたみ対応)
          body: |
            ## LINE & Bumble AI返信アシスタント v1.9.4

            ### ⚡ 1. 【爆速化・ラグ完全解消（10秒超 → 約1.0秒）】
            - **実在稼働モデル（Gemini 2.5 Flash / 2.0 Flash）優先直行ルーティング**: 存在しないモデルへの連続404試行ループおよび起動時ブロッキング全モデル探索を撤廃。
            - **画像軽量圧縮（1024px / 75%）**: ペイロードを約80KB〜100KBに抑え、アップロード通信時間を大幅削減。
            - **タイムアウト短縮**: クライアント接続5秒・読込10秒のFail-Fast設計。

            ### 🎯 2. 【LINE画面最下部の「相手の最新メッセージ」ピンポイント認識】
            - **トーク構造の明示的プロンプティング**: 画面上部や中央にある過去メッセージ（古いやり取り）を完全無視し、画面の最下部（入力欄の直上）にある左側の相手吹き出しのみを返信対象に指定。
            - **返信対象プレビュー機能**: ポップアップ内に「🎯 返信対象: 『〇〇』」を表示し、どのメッセージに反応しているかをひと目で確認可能。
            - **スクショ保存待ち＆時刻ズレ許容**: スクショ撮影直後の `IS_PENDING` 自動リトライ、および -5秒〜60秒の時刻差許容で取りこぼしを根絶。

            ### 🔝 3. 【アクションバーの画面上部（Top Dock）移動 ＆ 折りたたみ対応】
            - **キーボード・入力欄の干渉完全根絶**: LINEの文字入力欄・キーボード・送信ボタンを塞がないよう、バーを画面上部（ステータスバー直下・ヘッダー帯）に標準配置。
            - **ワンタップ折りたたみ（◀ / ▶）**: ボタン列を最小化し、小さなピルバッジとして邪魔にならずに常駐可能。自由ドラッグ移動にも完全対応。
            - **返信選択後の復帰ディレイ（1.2秒）**: 返信文コピー直後にバーが邪魔にならないよう、落ち着いてペースト・送信できる時間を確保。

            ### 🔒 【固定署名キーストアによる直接「更新」】
            - 固定キーストア署名（release.keystore）のため、アンインストール不要でそのまま「更新」可能です。
          files: |
            app/build/outputs/apk/release/line-ai-reply.apk
            app/build/outputs/apk/release/line-ai-reply-v1.9.4.apk

          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

