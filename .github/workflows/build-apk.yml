name: Build Line AI Reply APK

on:
  push:
    branches:
      - main
      - feat/*
  workflow_dispatch:

jobs:
  build:
    name: Build Line AI Reply APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build with Gradle
        run: |
          gradle assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply.apk
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply-v1.5.6.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: line-ai-reply.apk
          path: app/build/outputs/apk/release/line-ai-reply.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.6
          name: LINE & Bumble AI Reply Assistant v1.5.6 (LINE/Bumble全敬語同期・過去ログ2倍240件・Bumbleプロフ全文抽出＆システム通知除外)
          body: |
            ## LINE & Bumble AI返信アシスタント v1.5.6

            ### 🎯 【重要改善・修正点】
            1. **LINE & Bumble 敬語同期の完全徹底**:
               - LINE・Bumbleともに、相手が敬語（丁寧語）でメッセージを送っている場合は、AI提案の4案すべてを親しみやすく礼儀正しい「丁寧語（です・ます調）」に完全統一（タメ口の強制出力を完全撤廃）。
               - 語尾に絵文字や波線が付いたメッセージ（「カフェ巡り好きです😊」「行きたいです〜！✨」）でも敬語を100%確実に検知できるよう正規表現を抜本改良。
               - プロンプトおよび即時フォールバックの両方で丁寧語バリエーション（🎯丁寧・即答、🙅‍♂️丁寧・代案、💬丁寧・質問調整、😄丁寧・共感）を完全実装。
            2. **過去会話ログの参照深度を2倍（最大240ターン）に拡張**:
               - プロンプトへ注入する過去の会話履歴を従来の120ターンから「240ターン（2倍スパン）」へ大幅倍増。
               - 直近の画面内コンテキストも40件まで深く遡って文脈を正確に把握。
            3. **Bumbleシステム通知の完全除外（会話破綻の根本原因を解消）**:
               - 「相手が最初のメッセージを送信しました」「返信まであと24時間」「マッチしました！」「質問ゲーム」等のBumbleシステムバナーを相手のメッセージと誤認していた問題を完全修正。
               - システム通知に対する無意味な定型文返信を根絶し、相手の発言に的確に応答。
            4. **Bumbleプロフィールの全文抽出＆言及義務化**:
               - プロフィール画面から自己紹介文（Bio）、プロンプト回答、バッジ、居住地をキーワードに依存せず全文抽出し、キャッシュ。
               - 相手のプロフィール（趣味、休日の過ごし方、写真、仕事など）に必ず自然に触れて共感・質問するようプロンプトの言及ルールを厳格化。

            ### 🛡️ 【固定署名キーストアによる直接「更新」】
            - 固定キーストア署名のため、旧バージョンをアンインストールせずそのまま「更新」可能です。
          files: |
            app/build/outputs/apk/release/line-ai-reply.apk
            app/build/outputs/apk/release/line-ai-reply-v1.5.6.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

