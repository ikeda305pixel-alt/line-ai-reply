name: Build Line AI Reply APK

on:
  push:
    branches:
      - main
      - feat/*
  workflow_dispatch:

jobs:
  build:
    name: Build Line AI Reply APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build with Gradle
        run: |
          gradle assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/line-ai-reply.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: line-ai-reply.apk
          path: app/build/outputs/apk/debug/line-ai-reply.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: LINE & Bumble AI Reply Assistant v1.0.0
          body: |
            ## LINE & Bumble AI返信アシスタント (Pixel 7 / Android 13/14/15 向け)

            ### 主な機能
            - **LINE**: 過去12件の会話の流れを最重視した自然な返信案を自動生成
            - **Bumble**: ラリー数（やり取りの回数）を自動検知し、仲良くなったベストなタイミングでLINE交換リンクを自動提案（英語／日本語も自動見極め）
              - LINE誘導リンク: `https://line.me/ti/p/TYxbDIk4sd`
            - **安全設計**: 選択した返信は入力欄に下書き挿入されるのみ（勝手に送信されません）
            - **直に入力**: 「✍️ 直に入力」ボタンでいつでも手動入力に切り替え可能
            - **完全無料**: Google AI Studio 無料枠対応 ＆ オフラインでも動くスマートモック内蔵
          files: app/build/outputs/apk/debug/line-ai-reply.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
