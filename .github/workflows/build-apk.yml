name: Build Line AI Reply APK

on:
  push:
    branches:
      - main
      - feat/*
  workflow_dispatch:

jobs:
  build:
    name: Build Line AI Reply APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build with Gradle
        run: |
          gradle assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply.apk
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply-v1.5.0.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: line-ai-reply.apk
          path: app/build/outputs/apk/release/line-ai-reply.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.0
          name: LINE & Bumble AI Reply Assistant v1.5.0 (チャラさ完全排除・全部俺流4択・LINE/Bumble完全分離・過去ログ2.5倍深掘り版)
          body: |
            ## LINE & Bumble AI返信アシスタント v1.5.0 (チャラさ完全排除・全部俺流4択・LINE/Bumble完全分離版)

            ### 🚫 【チャラさ・恋愛工学の完全永久追放】全部「俺流」の等身大4択へ刷新
            - **LINE（友達・家族・仕事・日常連絡）とBumble（マッチングアプリ）を完全分離**:
              - LINEでは恋愛工学、ホスト風の転がし、キザな口説きを**100%永久排除**。
              - 家族や男友達にそのまま送れる「等身大の俺（タメ口、短文、テンポ、親しみやすさ）」に統一。
            - **人間の日常チャット基本4大パターンの完全網羅**:
              1. 🎯 **【俺流・即答（YES / 了解）】**: 承諾、合意、快諾、感謝のド直球返信。（「おけ！行こ！」「了解〜！」「助かる、ありがとう！」）
              2. 🙅‍♂️ **【俺流・代案（NO / 条件付き）】**: 角を立てずに断る、別日程・場所を提案する、または保留。（「その日先約あって厳しいわ！来週どう？」「今立て込んでるから後で連絡するわ！」）
              3. 💬 **【俺流・質問調整】**: 話や予定を具体的に進めるための時間・場所・詳細の質問や日程調整。（「何時くらいになりそう？」「どこ集合にする？」「どんな店？」）
              4. 😄 **【俺流・ツッコミ共感】**: 親しい間柄でのクスッと笑えるツッコミ、または素直な労い・共感。（「それ笑うんだけど😂 さすがだわ」「今日もお疲れ！無理すんなよ」）
            - **Bumble専用の爽やか4択**:
              - 🎯【俺流・ストレート即答】、☕️【俺流・共感質問】、😄【俺流・ツッコミ】、🚀/📲【俺流・爽やか提案/LINE交換】。

            ### 📈 【過去ログの遡りスパンを2倍以上に拡張】
            - **トーク入室時の自律サイレント遡りスキャン**: 2画面 ➔ **5画面分（2.5倍！）** に拡張。
            - **「過去ログ全同期」ディープスキャン**: 12画面 ➔ **24画面分（2倍！）** に拡張。
            - **会話履歴保持件数**: 150件 ➔ **300件（2倍！）** に倍増。
            - **ユーザー俺流文体サンプル**: 60件 ➔ **120件（2倍！）** に倍増。
            - **プロンプト注入過去ログ数**: 80件 ➔ **120件** に拡大。過去の約束や話題をさらに長期記憶。

            ### 🛡️ 【P0バグ完全根絶済み（v1.4.6より継承）】
            - 入力欄（EditText）下書きの誤混入防止。
            - ユーザー長文（3行以上）の右端不変量判定。
            - 自己返信・相槌の完全禁止。
          files: |
            app/build/outputs/apk/release/line-ai-reply.apk
            app/build/outputs/apk/release/line-ai-reply-v1.5.0.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

