name: Build Line AI Reply APK

on:
  push:
    branches:
      - main
      - feat/*
  workflow_dispatch:

jobs:
  build:
    name: Build Line AI Reply APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build with Gradle
        run: |
          gradle assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply.apk
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply-v1.5.4.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: line-ai-reply.apk
          path: app/build/outputs/apk/release/line-ai-reply.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.4
          name: LINE & Bumble AI Reply Assistant v1.5.4 (バブル即時消去✕ボタン・キーボード自動隠蔽・完全非表示設定版)
          body: |
            ## LINE & Bumble AI返信アシスタント v1.5.4 (邪魔なアイコン完全制御版)

            ### 🚫 【「アイコンが邪魔」を完全解決する新機能】
            - **バブル上に「✕」即座消去ボタンを新設**:
              - フローティングバブル（💬）の横に小さな「✕」ボタンを配置しました。「今は邪魔！」と思ったらワンタップで即座に非表示にできます。
            - **文字入力中（キーボード表示中）の自動非表示**:
              - キーボードが開いてメッセージを入力している間は、送信ボタンや文字入力を一切塞がないよう、バブルを自動的に完全に隠します。
            - **アプリ内設定で「バブル完全非表示」スイッチを新設**:
              - アプリ設定画面（MainActivity）に「トーク画面でのバブル表示」ON/OFFスイッチを追加しました。OFFにすれば、画面上にバブルを1ミリも出さない完全クリーン運用が可能です。
            - **バブルの小型化・半透明化（控えめデザイン）**:
              - 48dpからコンパクトな40dpにスリム化し、通常時は半透明（alpha 0.82）にすることで視界を邪魔しません。

            ### 💡 【Androidの「人型マーク 👤」ショートカットの消し方】
            - 端末の「設定」➔「ユーザー補助」➔「LINE AI Reply」を開き、「ショートカット」をOFFにすることで、画面端のシステムアイコンも完全に消すことができます。

            ### 🛡️ 【PayPay完全無干渉＆厚木・茅ヶ崎生活圏ローカライズ】
            - LINEとBumble以外ではオーバーレイ・アクセシビリティを100%完全遮断。
            - ユーザー拠点は「厚木市・茅ヶ崎市・湘南エリア在住」に固定し、東京提案は完全禁止。

            ### 🛡️ 【固定署名キーストアによる直接「更新」】
            - アプリのアンインストール不要で、そのまま「更新」を押すだけで即座にアップデート完了。
          files: |
            app/build/outputs/apk/release/line-ai-reply.apk
            app/build/outputs/apk/release/line-ai-reply-v1.5.4.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

