name: Build Line AI Reply APK

on:
  push:
    branches:
      - main
      - feat/*
  workflow_dispatch:

jobs:
  build:
    name: Build Line AI Reply APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build with Gradle
        run: |
          gradle assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply.apk
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply.apk
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply-v1.4.5.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: line-ai-reply.apk
          path: app/build/outputs/apk/release/line-ai-reply.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.5
          name: LINE & Bumble AI Reply Assistant v1.4.5 (プラグイン最適化・会話ログ完全自動蓄積＆AI全注入版)
          body: |
            ## LINE & Bumble AI返信アシスタント v1.4.5 (プラグイン最適化・完全自律ログ学習版)

            ### 🚀 【完全ゼロクリック】自律ログ収集アーキテクチャ
            - **手動読込ボタンの完全撤廃**:
              ユーザーがトーク画面を開く、スクロールする、会話するだけで、バックグラウンドで100%自動的にメッセージを検出・収集。
            - **ステータスバッジ化**:
              オーバーレイには「✅ ログ自動蓄積: ○件」とリアルタイム状態が表示され、ユーザーが手動で何かを押す必要は一切ありません。

            ### 📚 【相手別・完全蓄積会話ログストア】
            - **相手ごとの時系列全ログ永続化**:
              各相手（LINE/Bumble）との過去の会話やり取り全履歴を、時系列順で最大150件までローカルに安全蓄積。
            - **幾何学的・時系列重複排除**:
              上下スクロールや画面再描画時の重複メッセージをシーケンスアラインメントで完全排除。

            ### 🧠 【返信生成時の過去全ログ自動注入】
            - **過去の会話コンテキストをAIが完全把握**:
              画面上の高々10件だけでなく、過去に話した約束、好きな食べ物、エリア、内輪ノリなどの蓄積会話ログ（最大80件）をGeminiプロンプトに全自動注入。
            - **最高精度の返信生成**:
              過去の文脈と矛盾しない、圧倒的に自然で高EQな返信（🎯即答、🤝転がし、😄ツッコミ、🚀提案/LINE移行）を生成。

            ### 🧩 【プラグイン型モジュール設計】
            - `IConversationHarvesterPlugin`: 幾何学的話者分離・プロフ抽出
            - `IConversationMemoryPlugin`: 相手別時系列蓄積ストア・俺スタイル学習
            - `IPersonaSynthesizerPlugin`: 過去ログ統合プロンプト合成・レスポンス解析
            - `IDynamicModelRouterPlugin`: ListModels API動的検知・自動フォールバック
          files: |
            app/build/outputs/apk/release/line-ai-reply.apk
            app/build/outputs/apk/release/line-ai-reply-v1.4.5.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

