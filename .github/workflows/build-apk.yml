name: Build Line AI Reply APK

on:
  push:
    branches:
      - main
      - feat/*
  workflow_dispatch:

jobs:
  build:
    name: Build Line AI Reply APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build with Gradle
        run: |
          gradle assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply.apk
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply-v1.4.4.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: line-ai-reply.apk
          path: app/build/outputs/apk/release/line-ai-reply.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.4
          name: LINE & Bumble AI Reply Assistant v1.4.4 (ループエンジニアリング全合格・左右完全分離・自動ログ学習版)
          body: |
            ## LINE & Bumble AI返信アシスタント v1.4.4 (ループエンジニアリング全合格版)

            ### 🎯 【P0バグ完全撃破】左右話者分離の幾何学的証明に基づく刷新
            - **相手の長文（20文字以上）誤判定の根絶**:
              相手の吹き出しが右に伸びた際、`rightMargin < leftMargin` で「自分」と誤判定されていた致命的バグを解消。
              LINE/Bumbleの不変特性（相手は必ず左端 `rect.left <= 24%` から開始、自分は時刻・既読スペースのため `rect.left > 24%`）に基づく完全幾何学判定に移行。
            - **返信対象を相手メッセージに100%固定**:
              自分の送信メッセージや相槌に絶対に返信せず、常に相手の最新発言のみを回答ターゲットとします。

            ### 🤖 【P1&P2改善】過去ログ全自動学習 ＆ Bumbleプロフ精度向上
            - **アクセシビリティ `typeViewScrolled` 正式追加**:
              ユーザーがトーク画面を通常スクロールするだけで受動的ログ収集が100%漏れなくバックグラウンド発火。
            - **ワンタップ全自動遡りスキャン (`allMessageTurns`)**:
              「🤖 過去ログ全自動読込」で画面を遡りながら、10件制限なく全件メッセージを一網打尽にスキャン＆「俺スタイル」「相手カルテ」に完全自動学習。
            - **Bumbleプロフィール誤キャッシュ防止**:
              チャット吹き出しがプロフィールBioに誤混入する不具合を修正。Bio/Prompts固有キーワードのみを厳格抽出。
            - **URL除去による言語誤判定防止**:
              LINE URL等の英字リンクで日本人相手が「英語」と誤判定されるエッジケースをサニタイズ処理で根絶。
            - **フランクなLINE移行文**:
              ユーザーの「俺スタイル」に合わせ、「予定立てやすいしLINE交換しよー！」にブラッシュアップ。

            ### 🚀 404エラー根絶・固定キーストアワンタップ更新
            - `ListModels` API 動的自動検知
            - 固定署名キーによる直接上書き「更新」対応
          files: |
            app/build/outputs/apk/release/line-ai-reply.apk
            app/build/outputs/apk/release/line-ai-reply-v1.4.4.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

