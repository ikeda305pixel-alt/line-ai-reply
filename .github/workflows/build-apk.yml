name: Build Line AI Reply APK

on:
  push:
    branches:
      - main
      - feat/*
  workflow_dispatch:

jobs:
  build:
    name: Build Line AI Reply APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build with Gradle
        run: |
          gradle assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply.apk
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply-v1.8.0.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: line-ai-reply.apk
          path: app/build/outputs/apk/release/line-ai-reply.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8.0
          name: LINE & Bumble AI Reply Assistant v1.8.0 (通知OFF・PayPay完全共存・スクショ自動検知＆クリップボード連携・Android 15画面保護対応)
          body: |
            ## LINE & Bumble AI返信アシスタント v1.8.0

            ### 🚀 【LINE通知OFF環境に完全対応＆PayPay安全両立】
            LINEの通知をOFFにしているユーザー様向けに、MediaProjectionとAccessibilityServiceを完全撤廃した状態で、LINE画面上で快適にAI返信を生成できる新アーキテクチャへ移行しました。

            ### 📸 【ルートA：OS標準スクリーンショット自動検知（MediaStore）】
            1. **Android 15の画面共有黒画面ブロックを根本回避**:
               - アプリによる画面録画（MediaProjection）ではなく、ユーザーが通常通り撮影したOS標準スクリーンショット（電源＋音量下など）を自動検知。
               - Android 15のOS画面共有保護（"セキュリティ上、画面共有ではアプリの内容は非表示となります"）に一切抵触せず、LINEトーク画面の内容を100%正確にGemini Visionが直接解析します。
            2. **直近15秒以内のスクショを最優先で自動ロード**:
               - バブルまたは下部バーをタップした際、直近15秒以内に撮影された最新スクショがあれば自動的にGemini Visionへ送信して返信候補を生成。
            3. **一時スクショ自動削除オプション**:
               - AI解析後に一時スクショをストレージから自動削除する設定スイッチを追加（端末容量を圧迫しません）。

            ### 📋 【ルートB：クリップボード自動読み取り（Window Focusトリック）】
            1. **Android 10+のバックグラウンドクリップボード制限をクリア**:
               - バブルまたは下部バーがタップされた瞬間にオーバーレイのフォーカスを一時取得し、`ClipboardManager`からコピーされたLINEメッセージを確実に取得。
               - スクショがない場合でも、トーク内のメッセージを長押しコピーしてボタンを押すだけで即座にAI返信案を生成します。

            ### ✍️ 【ルートC：インライン一言メモ入力】
            - スクショもコピー文もない場合、オーバーレイ上にミニ入力バーが表示され、その場で「明日の予定」「カフェお誘い」などのキーワードを入力してAI生成できます。

            ### 🎛️ 【画面端バブル ＆ 画面下部バー（4つの即答モード）】
            - **💬 返信提案**: 相手のトーンに合わせた高EQなスマート返信案
            - **📅 日程調整**: 神奈川（厚木・茅ヶ崎・湘南・海老名・横浜）限定のスマートなお誘い・日程提案（東京提案は完全禁止）
            - **💡 話題提案**: 相手の興味を惹きつける会話のきっかけ・質問
            - **🔍 ムード分析**: 相手の心理状態・好感度分析と戦略的返信プラン

            ### 🎯 【既存の高品質アシストルールの完全継承】
            - **敬語完全同期**: 相手が敬語なら必ず丁寧語（です・ます調）で統一。
            - **写真リアクション**: 相手が写真を送ってきた場合の自然な言及。
            - **神奈川（厚木・茅ヶ崎・湘南・海老名・横浜）限定ルール**: 東京の店は絶対に提案せず地元でエスコート。

            ### 🔒 【固定署名キーストアによる直接「更新」】
            - 固定キーストア署名（release.keystore）のため、アンインストール不要でそのまま「更新」可能です。
          files: |
            app/build/outputs/apk/release/line-ai-reply.apk
            app/build/outputs/apk/release/line-ai-reply-v1.8.0.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

