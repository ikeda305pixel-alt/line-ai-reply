name: Build Line AI Reply APK

on:
  push:
    branches:
      - main
      - feat/*
  workflow_dispatch:

jobs:
  build:
    name: Build Line AI Reply APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build with Gradle
        run: |
          gradle assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply.apk
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply-v1.9.5.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: line-ai-reply.apk
          path: app/build/outputs/apk/release/line-ai-reply.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.9.5
          name: LINE & Bumble AI Reply Assistant v1.9.5 (HTTP 429枠上限自動回避・gemini-3.1-flash-liteマルチモーダル直行・実稼働保証)
          body: |
            ## LINE & Bumble AI返信アシスタント v1.9.5

            ### 🛡️ 1. 【HTTP 429（利用枠制限）の完全自動回避・動的フォールバック】
            - **Google AI Studio モデル別クォータ自動切替**: `gemini-3.8-flash`等の1日20回上限到達（429）を検知すると、キャッシュを自動破棄して別枠の無料枠を持つ稼働中モデルへ即座にスイッチ。
            - **実通確認済モデル直行**: 実際に200 OK応答とマルチモーダル画像返信生成が確認済みの `gemini-3.1-flash-lite` および `gemini-3.5-flash-lite` を初手優先に配置。
            - **全滅時の親切ガイダンス**: 万が一全モデルの無料枠が尽きた場合も、新しい無料APIキーの取得方法をわかりやすくポップアップ内に案内。

            ### 🎯 2. 【LINE画面最下部の「相手の最新メッセージ」ピンポイント認識（継承）】
            - **トーク構造の明示的プロンプティング**: 画面上部の過去ログを完全無視し、画面の最下部（入力欄直上）にある左側の相手吹き出しのみを返信対象に指定。
            - **「🎯 返信対象: 『〇〇』」プレビュー表示**: どのメッセージに反応したかを常時明示。

            ### 🔝 3. 【画面上部Top Dockバー＆ワンタップ折りたたみ（継承）】
            - **入力欄・キーボード完全非干渉**: 画面上部ヘッダー帯に配置され、返信入力を一切妨害しません。
            - **ワンタップ折りたたみ（◀ / ▶）**: 邪魔な時はいつでも小さなピルバッジに最小化可能。

            ### 🔒 【固定署名キーストアによる直接「更新」】
            - 固定キーストア署名（release.keystore）のため、アンインストール不要でそのまま「更新」可能です。
          files: |
            app/build/outputs/apk/release/line-ai-reply.apk
            app/build/outputs/apk/release/line-ai-reply-v1.9.5.apk

          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

