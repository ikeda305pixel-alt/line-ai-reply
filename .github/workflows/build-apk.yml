name: Build Line AI Reply APK

on:
  push:
    branches:
      - main
      - feat/*
  workflow_dispatch:

jobs:
  build:
    name: Build Line AI Reply APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build with Gradle
        run: |
          gradle assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply.apk
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply-v1.4.6.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: line-ai-reply.apk
          path: app/build/outputs/apk/release/line-ai-reply.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.6
          name: LINE & Bumble AI Reply Assistant v1.4.6 (自己返信完全根絶・読込範囲内自律遡り・回答＆相手精密プロファイル版)
          body: |
            ## LINE & Bumble AI返信アシスタント v1.4.6 (自己返信完全根絶・精密プロファイル版)

            ### 🎯 【P0バグ完全撃破】自分の回答に自分で返信する不具合の完全根絶
            - **入力欄（EditText）のメッセージ混入を完全排除**:
              下書き中の入力欄テキストが相手メッセージ（左側）と誤判定されていた根本原因を修正。入力エリアおよびEditTextノードをチャットメッセージ抽出対象から100%除外。
            - **ユーザー長文（3行以上）の右寄せ不変量判定**:
              ユーザーが長文を送って吹き出しが左に広がった場合でも、LINE/Bumbleの右寄せ不変特性（`rightMargin <= 12%` または `rect.right >= 88%`）により「自分」と確実に同定。相手と誤判定されるバグを根絶。
            - **自己発言への相槌・自己返信をプロンプトレベルで完全禁止**:
              直前の発言者が自分自身の場合を明確に検知し、自分の発言への相槌・自己返信を完全禁止。相手の直前発言への回答別案、または自然な追加フォローを提案。

            ### 📚 【読める範囲内での自律遡りスキャン】
            - **トークルーム入室時のサイレント遡りスキャン**:
              チャット画面を開いた瞬間、バックグラウンドで2画面分を自律スクロールして過去ログを漏れなく収集し、すぐ最新メッセージ位置へ復帰。

            ### 🧠 【自分がどういう回答をするのかの精密プロファイル】
            - **ユーザー回答スタイルの自動学習**:
              蓄積された自分の全発言から、平均文字数、テンポ、語尾（〜わ、〜よ、〜じゃん、笑、😂）、結論ファースト即答パターンを自動分析してAIに注入。

            ### 👤 【その人のこともプロファイル（性格・生息地カルテ）】
            - **相手の性格タイプ自動分析**:
              相手の全発言から、わがまま・めんどくさい構ってちゃん・チャラい・警戒心強めなどの性格傾向と生息エリアを自動プロファイリングし、相手を転がす最適戦略を策定。
          files: |
            app/build/outputs/apk/release/line-ai-reply.apk
            app/build/outputs/apk/release/line-ai-reply-v1.4.6.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

