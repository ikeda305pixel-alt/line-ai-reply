name: Build Line AI Reply APK

on:
  push:
    branches:
      - main
      - feat/*
  workflow_dispatch:

jobs:
  build:
    name: Build Line AI Reply APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build with Gradle
        run: |
          gradle assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply.apk
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply-v2.0.2.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: line-ai-reply.apk
          path: app/build/outputs/apk/release/line-ai-reply.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.2
          name: LINE & Bumble AI Reply Assistant v2.0.2 (外国人・英語話者への100%ネイティブ英語返信完全保証)
          body: |
            ## LINE & Bumble AI返信アシスタント v2.0.2 (English Speaker Support)

            ### 🌍 1. 【外国人・英語話者への英語返信を完全実装（日本語返信厳禁）】
            - **スクショ画像認識（Gemini Vision）での言語自動判定**: 相手の最新メッセージが英語、または相手が外国人/バイリンガル、Bumble等のプロフィール・チャットが英語である場合、**返信案4つをすべて100%自然でチャーミングな日常会話のネイティブ英語（タメ口・短文・スラング）で作成**するルールをプロンプト最上位に厳格設定。
            - **クリップボード・テキスト返信での英語自動検知**: ラテン文字比率や外国キーワードを自動検知し、英語話者の場合は100%英語で返信案を生成。
            - **全4モード（返信・日程・話題・分析）の英語専用プロンプト完備**: 神奈川エリア（Yokohama, Shonan, Chigasaki, Ebina）のスマートな提案も含め、自然な英語表現に完全対応。
            - **オフライン/フォールバック時の英語対応**: 英語相手の通信エラー時にも日本語が出ず、英語の高品質フォールバック候補を表示。

            ### 🔒 【固定署名キーストアによる直接「更新」】
            - 固定キーストア署名（release.keystore）のため、アンインストール不要でそのまま「更新」可能です。
          files: |
            app/build/outputs/apk/release/line-ai-reply.apk
            app/build/outputs/apk/release/line-ai-reply-v2.0.2.apk

          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

