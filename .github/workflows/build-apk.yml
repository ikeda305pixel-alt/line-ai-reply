name: Build Line AI Reply APK

on:
  push:
    branches:
      - main
      - feat/*
  workflow_dispatch:

jobs:
  build:
    name: Build Line AI Reply APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build with Gradle
        run: |
          gradle assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply.apk
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply-v1.5.2.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: line-ai-reply.apk
          path: app/build/outputs/apk/release/line-ai-reply.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.2
          name: LINE & Bumble AI Reply Assistant v1.5.2 (トーク画面限定表示・ボタン重複解消・UI抜本改善版)
          body: |
            ## LINE & Bumble AI返信アシスタント v1.5.2 (トーク画面限定表示・UI二重化根絶版)

            ### 💬 【トーク画面（チャットルーム）限定表示の徹底】
            - **アプリ外・一覧画面での常駐バブルを完全排除**:
              - ホーム画面（ランチャー）や他アプリはもちろん、LINE/Bumble内の「トーク一覧」「ホーム」「ニュース」「VOOM」「ウォレット」などトーク画面外ではバブルを即座に完全非表示（`hideAll()`）。
              - 実際の「トーク画面（チャットルーム）」に入り入力欄が存在する時のみ、控えめにフローティングバブル（💬）を表示します。

            ### 🎯 【ボタン二重表示（重複表示）の完全根絶】
            - **フローティングバブルと返信カードの完全排他制御**:
              - 返信カード表示中はバブルを即座に非表示にし、画面上にボタンが二重に見える不快感を解消。返信カードを閉じた際にのみ安全にバブルが復帰します。
            - **イベント二重発火・重複Jobの防止**:
              - 返信ボタンタップ時のアクセシビリティ誤爆リスナーを撤廃し、先行する返信生成タスクを明示的にキャンセル（`replyJob?.cancel()`）することで、返信カードが多重に重なる現象を防止。
            - **洗練されたクリーンなUI**:
              - Bumble時の案4（LINE交換）と重複していた下部バーの「LINE誘う」ボタンや不要な設定ボタンを削除。
              - 「タップで入力欄にセットされます」「🔄 別の案」「✍️ 手動入力」の直感的で美しいUIに刷新。

            ### 🌐 【英語話者へのネイティブ英語返信＆画面静止保証】
            - 英語メッセージには100%自然なネイティブ英語4択で回答。
            - バックグラウンドでの勝手な左右スクロール・タブ切り替わり・広告ジャンプはゼロ。

            ### 🛡️ 【固定署名キーストアによる直接「更新」】
            - アプリのアンインストール不要で、そのまま「更新」を押すだけで即座にアップデート完了。
          files: |
            app/build/outputs/apk/release/line-ai-reply.apk
            app/build/outputs/apk/release/line-ai-reply-v1.5.2.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

