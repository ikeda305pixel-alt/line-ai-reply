name: Build Line AI Reply APK

on:
  push:
    branches:
      - main
      - feat/*
  workflow_dispatch:

jobs:
  build:
    name: Build Line AI Reply APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build with Gradle
        run: |
          gradle assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply.apk
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply-v1.5.1.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: line-ai-reply.apk
          path: app/build/outputs/apk/release/line-ai-reply.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.1
          name: LINE & Bumble AI Reply Assistant v1.5.1 (英語話者対応・勝手なスクロール/タブ切り替わり/広告ジャンプ完全根絶版)
          body: |
            ## LINE & Bumble AI返信アシスタント v1.5.1 (英語話者対応・画面静止保証版)

            ### 🌐 【英語話者には100%自然なネイティブ英語で回答】
            - **英語話者の高精度自動判定**:
              - 相手のメッセージが英語（アルファベットのみ、または英語主体）の場合、短い挨拶（"Hey!", "How are you?"等）であっても確実に英語話者と判定。
            - **LINE・Bumble両方で英語返信を完全サポート**:
              - LINE: 🎯【Direct YES / Count me in】, 🙅‍♂️【Alternative NO / Reschedule】, 💬【Details / Question】, 😄【Humor / Reaction】
              - Bumble: 🎯【Direct Answer】, ☕️【Connection & Question】, 😄【Witty Banter】, 🚀/📲【Casual Plan / Switch to LINE】
              - 日本語が混入することなく、ユーザーの等身大でフレンドリーな自然体英語（スラング・テンポ感）で4択を生成。

            ### 🛑 【勝手なスクロール・タブ切り替え・広告ジャンプの完全根絶】
            - **バックグラウンド自動スクロールの全廃**:
              - 入室時や画面遷移時の自動スクロールを完全撤廃。バックグラウンド収集は表示中画面のパッシブ読み込み（画面の動き0ミリ）のみに限定。
              - 画面が勝手に左右に動いたり、違うタブ（ニュース・VOOM・ウォレット）に切り替わったり、広告バナーに飛ぶ現象を100%根本根絶。
            - **手動「過去ログ全同期」の垂直専用安全ガード**:
              - トーク画面内（入力欄存在時）のみ動作保証。
              - ViewPager、HorizontalScrollView、タブレイアウト、広告バナー、ステッカーカルーセルへのスクロールアクションを厳密に完全遮断。

            ### 🛡️ 【固定署名キーストアによる直接更新】
            - アプリのアンインストール不要で、そのまま「更新」を押すだけでアップデート完了。
          files: |
            app/build/outputs/apk/release/line-ai-reply.apk
            app/build/outputs/apk/release/line-ai-reply-v1.5.1.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

