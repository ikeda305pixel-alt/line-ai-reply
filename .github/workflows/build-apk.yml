name: Build Line AI Reply APK

on:
  push:
    branches:
      - main
      - feat/*
  workflow_dispatch:

jobs:
  build:
    name: Build Line AI Reply APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build with Gradle
        run: |
          gradle assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/line-ai-reply.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: line-ai-reply.apk
          path: app/build/outputs/apk/debug/line-ai-reply.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: LINE & Bumble AI Reply Assistant v1.3.0
          body: |
            ## LINE & Bumble AI返信アシスタント v1.3.0 (外国人・英語対応＆Bumbleプロフィール完全連動版)

            ### 主なアップデート
            - **Bumble プロフィール・自己紹介・プロンプト完全連動**:
              マッチ相手のプロフィール情報（趣味、仕事、出身地、興味、プロンプト回答等）を画面および閲覧履歴から自動抽出し、AIに連携。「プロフ見たよ！」という自然な言及や共通の話題を織り交ぜた魅力的な返信を生成。
            - **外国人・英語話者・バイリンガル自動見極め**:
              相手の言語傾向（英語、外国人日本語、バイリンガル、日本人）を動的に判定。英語話者にはチャーミングで機転の利いた英語、日本在住の外国人には分かりやすく親切な日本語、日本人にはタメ口/敬語の同調を実施。
            - **ヘッダーからの相手の名前自動認識**:
              画面上部から相手の名前/ニックネームを取得し、AIの対話ペルソナに組み込み。
            - **オーバーレイ上のプロフィール・言語インジケーター**:
              認識したプロフィール概要（`👤 プロフ: ...`）や言語タグ（`🌐英語`、`🌐外国人/バイリンガル`）をUI上に明示。
            - **前バージョンからの継承**:
              空間座標による左右話者判定、質問へのド直球即答エンジン、4ペルソナ返信。
          files: app/build/outputs/apk/debug/line-ai-reply.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
