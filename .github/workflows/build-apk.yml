name: Build Line AI Reply APK

on:
  push:
    branches:
      - main
      - feat/*
  workflow_dispatch:

jobs:
  build:
    name: Build Line AI Reply APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build with Gradle
        run: |
          gradle assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply.apk
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply-v1.7.0.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: line-ai-reply.apk
          path: app/build/outputs/apk/release/line-ai-reply.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7.0
          name: LINE & Bumble AI Reply Assistant v1.7.0 (MediaProjection完全撤廃・通知キャッシュ＆クリップボード連携・Android 15画面保護対応)
          body: |
            ## LINE & Bumble AI返信アシスタント v1.7.0

            ### 🚀 【MediaProjection（画面録画）＆AccessibilityService完全撤廃】
            1. **Android 15画面保護による黒画面ブロック問題を根本解決**:
               - Android 15以降の画面共有セキュリティ保護（"セキュリティ上、画面共有ではアプリの内容は非表示となります"）により強制黒塗りされる問題を完全解消。
               - 画面キャプチャ（MediaProjection）およびAccessibilityServiceをコードベースから100%削除。
               - ステータスバー左上の赤い録画中アイコンやOSのセキュリティ警告も一切表示されなくなりました。
            2. **PayPay・銀行アプリの安全両立を恒久維持**:
               - 引き続きAccessibilityServiceは存在しないため、PayPayや各行バンキングアプリの不正検知（RASP）に100%抵触しません。

            ### 📥 【NotificationListenerService（通知キャッシュ）＋クリップボード連携】
            1. **通知のバックグラウンド自動キャッシュ**:
               - LINE（およびBumble）の通知を受信すると、送信者・トークルームごとに直近メッセージ履歴をアプリ内ローカルストレージへ安全に自動記録。
            2. **画面端バブルから4つのアクションモードを瞬時に選択**:
               - **💬 返信提案**: 相手のトーンに合わせた高EQなスマート返信案
               - **📅 日程調整**: 神奈川（厚木・茅ヶ崎・湘南・海老名・横浜）限定のスマートなお誘い・日程提案
               - **💡 話題提案**: 相手の興味を惹きつける会話のきっかけ・質問
               - **🎭 ムード分析**: 相手の心理状態・好感度分析と戦略的返信プラン
            3. **複数トークルームのワンタップ切り替え**:
               - ポップアップ上部の名前チップ（`[👤 あやか (選択中)]` `[👤 田中]`）をタップするだけで、直近の会話相手を即座に切り替え可能。
            4. **クリップボード優先反映**:
               - LINE等で特定のメッセージを長押しコピーしておくと、AIがクリップボードのテキストを最優先コンテキストとして認識して返信を作成。
            5. **ワンタップ自動コピー**:
               - 案をタップするとクリップボードにコピーされ、トーストが表示。トーク入力欄にそのまま貼り付けて送信できます。

            ### 🎯 【既存の高品質アシストルールの完全継承】
            - **敬語完全同期**: 相手が敬語なら必ず丁寧語（です・ます調）で統一。
            - **写真リアクション**: 相手が写真を送ってきた場合の自然な言及。
            - **神奈川（厚木・茅ヶ崎・湘南・海老名・横浜）限定ルール**: 東京の店は絶対に提案せず地元でエスコート。

            ### 🔒 【固定署名キーストアによる直接「更新」】
            - 固定キーストア署名（release.keystore）のため、アンインストール不要でそのまま「更新」可能です。
          files: |
            app/build/outputs/apk/release/line-ai-reply.apk
            app/build/outputs/apk/release/line-ai-reply-v1.7.0.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

