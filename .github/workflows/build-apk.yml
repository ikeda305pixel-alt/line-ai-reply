name: Build Line AI Reply APK

on:
  push:
    branches:
      - main
      - feat/*
  workflow_dispatch:

jobs:
  build:
    name: Build Line AI Reply APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Run Unit Tests & Build Release APK
        run: |
          gradle testDebugUnitTest --stacktrace
          gradle assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply.apk
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply-v2.0.3.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: line-ai-reply.apk
          path: app/build/outputs/apk/release/line-ai-reply.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.3
          name: LINE & Bumble AI Reply Assistant v2.0.3 (QA完全検品＆全面リファクタリング)
          body: |
            ## LINE & Bumble AI返信アシスタント v2.0.3 (QA Inspected & Refactored)

            ### 🛡️ 1. Adversarial QA & Staff SWE 監査に基づく抜本修正
            - **短文英語挨拶の判定漏れ解消**: `"Hi"`, `"Hey"`, `"Yo"`, `"Ok"`, `"No"`, `"Yes"`, `"GM"`, `"GN"` などの短文も100%英語話者と判定し、確実にネイティブ英語で返信。
            - **Bumble等のUIノイズ排除 & Vision統合**: スクショ内の「マッチしました」「メッセージ」「〜km先」等の日本語UIを無視し、相手の吹き出し・Bio本文の言語のみを基準にするよう `ChatPromptBuilder` へ責務分離・刷新。
            - **記憶・俺スタイル・LINE誘導の完全再配線**: `ConversationMemoryManager` の相手カルテ・自分スタイルおよび自然なLINE誘導リンクを全経路（スクショ/クリップボード/メモ）に統合。

            ### ⚡ 2. パフォーマンス・安定性・UI/UX全面強化
            - **ANR/プチフリ撲滅**: スクショ読み込み・Bitmapリサイズ・Base64化を完全に `Dispatchers.IO` へオフロードし、使用後Bitmapを即時 `recycle()` 解放。
            - **連打排他制御 & クラッシュ防止**: 連続タップ時の多重API呼び出し防止（`currentActionJob?.cancel()`）、Focus Trick の `isAttachedToWindow` ガード、OkHttpレスポンスの `.use` クローズ徹底。
            - **実在安定モデル優先 & フォールバック確約**: 実在モデル（`gemini-2.0-flash` 等）優先化と、通信失敗時の高品質フォールバック4案表示を復元。
            - **片手エルゴノミクス改善**: 返信カードを `ScrollView` 対応し、全操作ボタンの最小タップ領域を 48dp 以上に拡大。

            ### 🔒 【固定署名キーストアによる直接「更新」】
            - 固定キーストア署名（release.keystore）のため、アンインストール不要でそのまま「更新」可能です。
          files: |
            app/build/outputs/apk/release/line-ai-reply.apk
            app/build/outputs/apk/release/line-ai-reply-v2.0.3.apk

          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

