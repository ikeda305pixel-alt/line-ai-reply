name: Build Line AI Reply APK

on:
  push:
    branches:
      - main
      - feat/*
  workflow_dispatch:

jobs:
  build:
    name: Build Line AI Reply APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build with Gradle
        run: |
          gradle assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply.apk
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply-v1.4.3.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: line-ai-reply.apk
          path: app/build/outputs/apk/release/line-ai-reply.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.3
          name: LINE & Bumble AI Reply Assistant v1.4.3 (左右話者完全分離・過去ログ全自動スキャン学習版)
          body: |
            ## LINE & Bumble AI返信アシスタント v1.4.3 (左右話者完全分離・過去ログ全自動スキャン学習版)

            ### 🎯 左右話者分離の完全修正（右＝自分、左＝相手）
            - **自分への返信バグを根絶**:
              LINEの吹き出しが中長文（20文字以上）になった際に、画面左側に広がって「相手のメッセージ」と誤判定されていた判定アルゴリズムを刷新。
            - **厳密なマージン＆中心座標（centerX）判定**:
              右寄せの自分メッセージ（右マージン小・右側寄り）と左寄せの相手メッセージ（左マージン小・左側寄り）を100%確実に識別。
            - **返信対象ロックオン**:
              AIが返信対象とするメッセージを**左側チャット（相手の直前メッセージ）に100%限定**。画面最下部に自分の送信済みメッセージがあっても、絶対に自分に対して返信しません。
            - **プロンプト絶対厳守ルール0番**:
              「返信案は相手（左側）に対する返答であり、右側の自分の発言への返信・相槌は絶対禁止」をプロンプト最優先事項として徹底注入。

            ### 🤖 過去ログの「完全自動読み込み・学習」（手動エクスポート・ファイル操作不要）
            - **機能A：受動的リアルタイム自動蓄積**:
              LINEやBumbleを開いてスクロール・閲覧するだけで、画面上の全吹き出しをバックグラウンドで自動的にローカルメモリに蓄積。
            - **機能B：ワンタップ全自動遡りスキャン（「🤖 過去ログ全自動読込」ボタン）**:
              オーバーレイ上に新設された「🤖 過去ログ全自動読込」をタップすると、アプリ自身がトーク画面を上へ自動スクロールしながら過去ログを一網打尽にスキャン。
              - 自分の文体・語尾・テンポ（俺スタイル）を自動学習。
              - 相手の生息エリアや人間性（相手カルテ）を自動分析。
              - トーク履歴のファイル書き出しやコピー＆ペーストなどの手作業は一切不要！

            ### 🚀 404エラー根絶・動的モデル自動検知（v1.4.2より継続）
            - APIキーを入力した際、Googleの `ListModels` API を直接照会し、有効な最新モデル（gemini-2.5-flash等）を自動検知して接続。
          files: |
            app/build/outputs/apk/release/line-ai-reply.apk
            app/build/outputs/apk/release/line-ai-reply-v1.4.3.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

