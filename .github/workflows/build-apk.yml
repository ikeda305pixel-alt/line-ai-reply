name: Build Line AI Reply APK

on:
  push:
    branches:
      - main
      - feat/*
  workflow_dispatch:

jobs:
  build:
    name: Build Line AI Reply APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build with Gradle
        run: |
          gradle assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/line-ai-reply.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: line-ai-reply.apk
          path: app/build/outputs/apk/debug/line-ai-reply.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.1
          name: LINE & Bumble AI Reply Assistant v1.1.1
          body: |
            ## LINE & Bumble AI返信アシスタント v1.1.1 (相手への的確な直接回答・質問応答特化版)

            ### 主なアップデート
            - **Gemini 1.5 Flash 正式連携**: APIキー保存時にリアルタイム反映。アプリ内の「🔑 APIキーの通信テスト」で疎通確認可能。
            - **タイムスタンプ・既読・システム表示の完全除去**: LINE画面から時間表示や既読表示を除外し、相手が送った実際の発言・会話ログのみをAIに高純度で供給。
            - **文脈深掘りプロンプト**: 「いいね！最近どう？」のような浅い定型文を完全禁止。相手の具体的な発言キーワード（場所・食べ物・趣味・感情・ツッコミどころ）を拾って返す自然な返信を生成。
            - **クリップボード自動コピー対応**: 返信選択時に入力欄への自動挿入に加え、万が一のためにクリップボードにも自動コピー。
          files: app/build/outputs/apk/debug/line-ai-reply.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
