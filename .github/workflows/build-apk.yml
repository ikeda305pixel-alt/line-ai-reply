name: Build Line AI Reply APK

on:
  push:
    branches:
      - main
      - feat/*
  workflow_dispatch:

jobs:
  build:
    name: Build Line AI Reply APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build with Gradle
        run: |
          gradle assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply.apk
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply-v1.9.1.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: line-ai-reply.apk
          path: app/build/outputs/apk/release/line-ai-reply.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.9.1
          name: LINE & Bumble AI Reply Assistant v1.9.1 (ざっくばらん本音トーン復活・MediaProjection完全撤去・20秒スクショ検知＆クリップボード連携)
          body: |
            ## LINE & Bumble AI返信アシスタント v1.9.1

            ### ✨ 【ざっくばらん（自然体・本音・親近感）トーンの完全復活】
            - LINE＆Bumbleの両方で、飾らない等身大の本音やぶっちゃけトーク、親しい間柄でのクスッと笑える「ざっくばらん」な返信スタイルを案4（丁寧語でも親しみやすい本音共感）に正式採用。
            - 気取らない日常チャットから親密なやり取りまで、自然体で好印象な返信を1タップで選択可能。

            ### 🚀 【MediaProjection & AccessibilityService の完全撤廃】
            - 画面録画（MediaProjection）およびユーザー補助（AccessibilityService）のコードを完全抹消（0行）。
            - Android 15の画面共有黒画面ブロック（"セキュリティ上、画面共有ではアプリの内容は非表示となります"）およびPayPay・金融機関アプリの利用制限が100%発生しません。
            - Android 14/15 準拠: `FloatingBubbleService` の foregroundServiceType を `specialUse` とし、`PROPERTY_SPECIAL_USE_FGS_SUBTYPE` を正式定義。
            - 起動時は画面共有ダイアログを一切出さず、「他のアプリの上に重ねて表示」と「画像アクセス」権限のみで即座にオーバーレイを起動。

            ### 📸 【ルートA：OS標準スクリーンショット20秒自動検知（MediaStore + ContentObserver）】
            - Android標準のスクリーンショット（電源＋音量下など）を自動検知。OS黒塗り保護を根本回避。
            - **20秒判定ウィンドウ**: 直近20秒以内に撮影された最新スクショを最優先で自動ロード。
            - **`IS_PENDING == 0` チェック**: Android 10+でファイル書き込み完了を厳密に待機し、破損画像の読み込みを防止。
            - **1280px 最適圧縮**: 長辺1280pxに高品質リサイズ＆JPEG圧縮してGemini Vision APIへ高速送信。
            - **一時スクショ自動削除オプション**: AI解析後に端末容量を圧迫しない自動削除トグル。

            ### 📋 【ルートB：クリップボード自動読み取り（Window Focusトリック）】
            - スクショがない場合、オーバーレイのWindow Focus（`FLAG_NOT_FOCUSABLE`の一時解除）トリックにより、Android 10+のバックグラウンド制限を回避してコピー文面を即座に取得。

            ### ⚠️ 【APIキー未設定＆通信エラーの完全透明化（定型文フォールバックの完全廃止）】
            - **APIキー厳密判定**: `AIzaSy`で始まる25文字以上の正規Gemini APIキーでない場合、ダミー返信を表示せず、ポップアップ内に直接 `⚠️ 設定画面でGemini APIキー（AIzaSy...）を保存してください` を明示。
            - **通信エラーの直接表示**: Gemini APIとの通信失敗時（HTTP 400 / 403 / 429等）に、ダミー返信で隠さず、エラーコードと詳細メッセージをポップアップ上の赤色アラートバナーに直接可視化。

            ### 🎛️ 【画面端バブル ＆ 画面下部バー（4つの即答モード）】
            - **💬 返信提案**: 相手のトーンに合わせた高EQなスマート返信案（ざっくばらん本音対応）
            - **📅 日程調整**: 神奈川（厚木・茅ヶ崎・湘南・海老名・横浜）限定のスマートなお誘い（東京提案は完全禁止）
            - **💡 話題提案**: 相手の興味を惹きつける会話のきっかけ・質問
            - **🔍 ムード分析**: 相手の心理状態・好感度分析と戦略的返信プラン

            ### 🔒 【固定署名キーストアによる直接「更新」】
            - 固定キーストア署名（release.keystore）のため、アンインストール不要でそのまま「更新」可能です。
          files: |
            app/build/outputs/apk/release/line-ai-reply.apk
            app/build/outputs/apk/release/line-ai-reply-v1.9.1.apk

          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

