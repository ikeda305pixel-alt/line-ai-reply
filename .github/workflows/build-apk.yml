name: Build Line AI Reply APK

on:
  push:
    branches:
      - main
      - feat/*
  workflow_dispatch:

jobs:
  build:
    name: Build Line AI Reply APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Run Unit Tests & Build Release APK
        run: |
          gradle testDebugUnitTest --stacktrace
          gradle assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply.apk
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply-v2.0.4.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: line-ai-reply.apk
          path: app/build/outputs/apk/release/line-ai-reply.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.4
          name: LINE & Bumble AI Reply Assistant v2.0.4 (スクショAI返信 爆速化＆QA完全リファクタリング)
          body: |
            ## LINE & Bumble AI返信アシスタント v2.0.4 (Ultra-Fast Screenshot AI Reply)

            ### ⚡ 1. スクショ返信レイテンシの抜本高速化
            - **廃止モデル(404)排除＆2026年最新超高速モデルへ刷新**: 2026年6月廃止済みの旧モデル（2.0-flash/1.5-flash等）による無駄な404リトライ往復を完全排除し、最速実在モデル（`gemini-3.5-flash-lite` / `gemini-3.1-flash-lite` / `gemini-2.5-flash-lite` / `gemini-3.6-flash`）へ最優先ルーティング。さらに `cached_working_model` を永続化＆廃止モデル自動削除。
            - **Thinking遅延ゼロ化 & トークン確保**: モデル別の `thinkingConfig`（`minimal` / `thinkingBudget: 0`）を注入して長考遅延を撲滅。`maxOutputTokens=1280` 確保および400時の自動リトライ安全弁を装備。
            - **スクショ先読みプリキャッシュ＆軽量突合**: `ScreenshotObserver` によるバックグラウンド先読みエンコード＋`Pending`完了待機＋最新1行メタデータ突合により、他人のスクショ誤爆を防ぎつつタップ時の読み込み時間を **ほぼ 0ms** に短縮。
            - **OkHttp 接続プール共有・TLSプリウォーム・プロンプト42%圧縮**: 事前TLS接続ウォームアップと入力プロンプトのスリム化（精度・英語判定・記憶配線は100%維持）により、TTFTと生成時間を劇的短縮。また実測レイテンシ（ms）をポップアップに表示。

            ### 🛡️ 2. Loop Engineering ＆ Adversarial QA 検品・リファクタリング
            - **LINE誤爆防止**: Bumble等マッチングアプリ以外（LINEトーク画面）でのLINE交換リンク誤提案を厳格にブロック。
            - **デッドコード断捨離 & 並行安全性**: `PersonaSynthesizerPlugin` の死滅コード約375行を削除し、`ConversationMemoryPlugin` の同期保護、Focus Trick の `invokeOnCancellation`、モード切替時の最新スクショ優先とキャッシュ即再利用を実装。

            ### 🔒 【固定署名キーストアによる直接「更新」】
            - 固定キーストア署名（release.keystore）のため、アンインストール不要でそのまま「更新」可能です。
          files: |
            app/build/outputs/apk/release/line-ai-reply.apk
            app/build/outputs/apk/release/line-ai-reply-v2.0.4.apk

          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

