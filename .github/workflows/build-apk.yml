name: Build Line AI Reply APK

on:
  push:
    branches:
      - main
      - feat/*
  workflow_dispatch:

jobs:
  build:
    name: Build Line AI Reply APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build with Gradle
        run: |
          gradle assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply.apk
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply-v1.5.7.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: line-ai-reply.apk
          path: app/build/outputs/apk/release/line-ai-reply.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.7
          name: LINE & Bumble AI Reply Assistant v1.5.7 (PayPayセキュリティ完全突破・自動一時停止＆1タップ再開通知・クイック設定タイル対応)
          body: |
            ## LINE & Bumble AI返信アシスタント v1.5.7

            ### 💳 【PayPayセキュリティ完全突破＆0秒決済モード】
            1. **PayPay・主要決済アプリの自動検知＆完全自動一時停止**:
               - PayPay起動時にセキュリティ検知でブロックされる問題を抜本解決。
               - PayPay（および楽天ペイ、d払い、au PAY、メルペイ、銀行アプリ等）の起動を検知した瞬間、OSのユーザー補助サービスを自身で即座に一時停止（`disableSelf()`）。PayPayが100%エラーなく起動します。
            2. **決済後1タップで即座にAI返信を再開（設定の深い階層に行く必要ゼロ）**:
               - 一時停止と同時に常駐通知「💳 PayPay利用のためAI返信を一時停止しました」を自動発行。
               - 決済完了後、通知を1タップするだけで直接ユーザー補助の詳細トグル画面へジャンプ！設定メニューを探し回る手間をゼロにしました。
               - 再開スイッチをONにすると通知も自動で消去されます。
            3. **クイック設定パネル（通知バー）タイル対応**:
               - スマホの画面上部を引き下げて配置できる「PayPay決済 (AI停止)」クイック設定タイルを新設。
               - レジ前で通知バーからワンタップするだけで「AI返信停止＋PayPay即起動」が完了。
            4. **メイン画面に「PayPayモード起動」ボタンを追加**:
               - アプリ内からも1タップでPayPayを安全に起動可能。

            ### 🎯 【既存の高品質アシスト機能の完全維持】
            - **LINE & Bumble 敬語完全同期**: 相手が敬語なら4案すべてを丁寧語（です・ます調）で統一。
            - **過去ログ2倍深度（最大240件）参照**: 直近文脈を正確に把握。
            - **Bumbleプロフィール全文抽出＆言及義務化**: 自己紹介やプロンプト回答を確実に返信へ反映。
            - **神奈川（厚木・茅ヶ崎・湘南・海老名・横浜）限定ルール**: 東京の店は絶対に提案せず地元で自然にエスコート。

            ### 🛡️ 【固定署名キーストアによる直接「更新」】
            - 固定キーストア署名（release.keystore）のため、アンインストール不要でそのまま「更新」可能です。
          files: |
            app/build/outputs/apk/release/line-ai-reply.apk
            app/build/outputs/apk/release/line-ai-reply-v1.5.7.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

