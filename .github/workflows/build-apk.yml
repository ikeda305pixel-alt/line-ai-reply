name: Build Line AI Reply APK

on:
  push:
    branches:
      - main
      - feat/*
  workflow_dispatch:

jobs:
  build:
    name: Build Line AI Reply APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build with Gradle
        run: |
          gradle assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply.apk
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply-v2.0.1.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: line-ai-reply.apk
          path: app/build/outputs/apk/release/line-ai-reply.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.1
          name: LINE & Bumble AI Reply Assistant v2.0.1 (4層6役App専任スクワッド適用・レイテンシ実測＆モード解説搭載)
          body: |
            ## LINE & Bumble AI返信アシスタント v2.0.1 (App Squad Edition)

            ### 🏗️ 1. 【4層6役App専任スクワッド（PM・UI/UX・Core・Subsystem・Reviewer・QA）適用】
            - **アプリ内4大AIモード解説カード追加**: 返信・日程・話題・分析の各モードの役割とプロンプト方針をアプリ内で一目で把握可能に。
            - **稼働中モデル＆実測レイテンシ可視化**: 通信テスト時に応答ミリ秒（例: 742ms）を表示し、アクティブなGeminiモデルをUIに常時表示。
            - **通信サーキットブレーカー完全適用**: APIキー不正（400/403）時に無駄なモデルループを即時中断し、0.5秒でエラー原因を親切案内。

            ### 🔒 【固定署名キーストアによる直接「更新」】
            - 固定キーストア署名（release.keystore）のため、アンインストール不要でそのまま「更新」可能です。
          files: |
            app/build/outputs/apk/release/line-ai-reply.apk
            app/build/outputs/apk/release/line-ai-reply-v2.0.1.apk

          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

