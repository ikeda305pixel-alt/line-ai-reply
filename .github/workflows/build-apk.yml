name: Build Line AI Reply APK

on:
  push:
    branches:
      - main
      - feat/*
  workflow_dispatch:

jobs:
  build:
    name: Build Line AI Reply APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build with Gradle
        run: |
          gradle assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply.apk
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply-v1.9.2.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: line-ai-reply.apk
          path: app/build/outputs/apk/release/line-ai-reply.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.9.2
          name: LINE & Bumble AI Reply Assistant v1.9.2 (Google AI Studio最新キー「AQ.」完全対応・Gemini 3系モデル自動ルーティング・ざっくばらん本音トーン)
          body: |
            ## LINE & Bumble AI返信アシスタント v1.9.2

            ### 🔑 【Google AI Studio最新キー形式「AQ.」の完全サポート】
            - Google AI Studioで現在生成される最新形式のAuthentication Key（`AQ.Ab8RN...`）を完全サポート。
            - 旧来の `AIzaSy...` 形式バリデーションを根本撤廃し、最新キーでも弾かれず一発保存＆即時反映されます。
            - APIリクエストに `x-goog-api-key` ヘッダーを正式追加し、認証信頼性を100%保証。

            ### ⚡ 【2026年最新 Gemini 3系モデル（3-flash-preview / 3.8-flash等）への自動ルーティング】
            - Google側で廃止（404）となった旧モデル（gemini-2.0-flash / 2.5-flash）を整理し、高速動作が確認された最新世代（gemini-3-flash-preview, gemini-3.8-flash, gemini-3.5-flash, gemma-4-26b-a4b-it）へ優先ルーティング。
            - 応答速度約1.0秒の爆速返信生成を実現。

            ### ✨ 【ざっくばらん（自然体・本音・親近感）トーンの完全装備】
            - LINE＆Bumbleの両方で、飾らない等身大の本音やぶっちゃけトーク、親しい間柄でのクスッと笑える「ざっくばらん」な返信スタイルを案4（丁寧語でも親しみやすい本音共感）に正式採用。
            - 気取らない日常チャットから親密なやり取りまで、自然体で好印象な返信を1タップで選択可能。

            ### 🚀 【MediaProjection & AccessibilityService の完全撤廃（0行）】
            - 画面録画（MediaProjection）およびユーザー補助（AccessibilityService）を完全撤去。
            - Android 15の画面共有黒画面ブロックおよびPayPay・金融機関アプリの利用制限が100%発生しません。
            - 起動時は画面共有ダイアログを一切出さず、「他のアプリの上に重ねて表示」と「画像アクセス」権限のみで即座にオーバーレイを起動。

            ### 📸 【OS標準スクショ20秒自動検知 ＆ クリップボード連携】
            - 電源＋音量下等のOS標準スクショを `ContentObserver` で自動検知（20秒判定・1280pxリサイズ圧縮）。
            - スクショが無い場合は Window Focus トリックでコピー文面を自動取得。

            ### 🔒 【固定署名キーストアによる直接「更新」】
            - 固定キーストア署名（release.keystore）のため、アンインストール不要でそのまま「更新」可能です。
          files: |
            app/build/outputs/apk/release/line-ai-reply.apk
            app/build/outputs/apk/release/line-ai-reply-v1.9.2.apk

          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

