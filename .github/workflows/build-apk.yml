name: Build Line AI Reply APK

on:
  push:
    branches:
      - main
      - feat/*
  workflow_dispatch:

jobs:
  build:
    name: Build Line AI Reply APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build with Gradle
        run: |
          gradle assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply.apk
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply-v2.0.0.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: line-ai-reply.apk
          path: app/build/outputs/apk/release/line-ai-reply.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: LINE & Bumble AI Reply Assistant v2.0.0 (5大専門チーム合同監査・品質大刷新メジャーアップデート)
          body: |
            ## LINE & Bumble AI返信アシスタント v2.0.0 (Major Release)

            ### 🚀 1. 【5大専門チーム（司令塔・UI・機能・レビュー・検品）合同監査による品質大刷新】
            - **Google Modern Android Development (MAD) ＆ 御作法準拠**: ライフサイクル安全、構造化並行処理、OOM防御を完全網羅。

            ### 📱 2. 【UI/UX・人間工学の劇的進化】
            - **ドラッグハンドルの操作性向上**: ハンドル幅を32dpへ拡大し、左右セーフティマージンを確保して誤タップを防止。
            - **触覚フィードバック（Haptics）＆ 視覚確認**: 返信文タップ時に「コツッ」という触覚振動と「✓ コピー完了！」のアニメーションを表示。ペースト操作への圧倒的な手応えと安心感を提供。
            - **アクションバータッチターゲット適正化**: 48dpアクセシビリティ基準に沿ってボタン高さを34dpへ拡大。

            ### 🛠️ 3. 【機能・内部ロジックの堅牢化＆トークン50%削減】
            - **Gemini Vision 画像トークン半減（768px最適化）**: 1024pxからLINE文字認識の最適解768px（Gemini 1タイル=258トークン）へリサイズし、課金とレイテンシを半減。
            - **OOM完全防御＆Bitmap確実解放**: `Throwable` 捕捉によるOutOfMemoryErrorクラッシュ防止と、`finally` ブロックでの確実なネイティブメモリ解放。
            - **通信サーキットブレーカー**: 400/403などの非再試行エラー時に、無駄な8モデル空転ループを即時中断してユーザーへ親切案内。
            - **OkHttpClient 接続プール共有**: タイムアウト（Connect: 8s, Read: 25s, Write: 20s）を一元管理。

            ### 🧐 4. 【シニアピアレビューによる潜在バグ・メモリリーク根絶】
            - **ServiceScope キャンセル保証**: サービス破棄時のコルーチンキャンセルを実装し、破棄済みWindowManagerへの不正アクセスやメモリリークを完全解消。
            - **FocusListener 解除保証**: クリップボード取得タイムアウト時のリスナーリークを防止。
            - **デッドコード・二重キャッシュの一元化**: 稼働中モデルキャッシュを `DynamicModelRouterPlugin` に一本化。

            ### 🔒 【固定署名キーストアによる直接「更新」】
            - 固定キーストア署名（release.keystore）のため、アンインストール不要でそのまま「更新」可能です。
          files: |
            app/build/outputs/apk/release/line-ai-reply.apk
            app/build/outputs/apk/release/line-ai-reply-v2.0.0.apk

          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

