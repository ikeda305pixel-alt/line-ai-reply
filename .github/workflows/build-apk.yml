name: Build Line AI Reply APK

on:
  push:
    branches:
      - main
      - feat/*
  workflow_dispatch:

jobs:
  build:
    name: Build Line AI Reply APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build with Gradle
        run: |
          gradle assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply.apk
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply-v1.6.0.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: line-ai-reply.apk
          path: app/build/outputs/apk/release/line-ai-reply.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.0
          name: LINE & Bumble AI Reply Assistant v1.6.0 (AccessibilityService完全撤廃・画面キャプチャ＆Gemini Vision対応・PayPay完全両立)
          body: |
            ## LINE & Bumble AI返信アシスタント v1.6.0

            ### 🛡️ 【ユーザー補助（AccessibilityService）の完全撤廃＆PayPay完全両立】
            1. **AccessibilityServiceをコードベースおよびManifestから100%削除**:
               - PayPayや銀行アプリ等のセキュリティ制限（RASPによるAccessibilityService検知）の根本原因を完全根絶。
               - アプリ内にAccessibilityServiceクラス・パーミッションが一切存在しないため、PayPayのセキュリティ警告や利用制限に100%引っかかりません。
               - 一時停止や再開の手間も一切不要となり、常にPayPayや金融アプリをそのまま快適にご利用いただけます。

            ### 🚀 【画面キャプチャ（MediaProjection）＋フローティングバブルによる高精度AIアシスト】
            1. **画面端のフローティングバブル（💬）常駐**:
               - 「他のアプリの上に重ねて表示（`SYSTEM_ALERT_WINDOW`）」を用いた軽量バブルを画面端に表示。
               - 指で自由にドラッグ移動でき、画面端にスムーズに吸着（Edge Snapping）します。
            2. **バブルタップ時の自動スクリーンショット＆Gemini Vision解析**:
               - LINEやBumbleのトーク画面でバブルをタップすると、MediaProjection APIにより現在の画面をキャプチャ。
               - Gemini Vision（画像認識対応モデル）へ画像を送信し、メッセージ履歴・相手のトーン・送信された写真・プロフィールを直接解析。
               - 文脈に応じた自然で高EQな返信候補を3パターン生成します。
            3. **返信候補のポップアップ＆タップでクリップボード自動コピー**:
               - バブル付近に綺麗なオーバーレイカードで返信案を表示。
               - 気に入った候補をタップするだけでクリップボードにコピーされ、トースト通知が表示されます。トーク入力欄にそのままペーストして送信できます。

            ### 🎯 【既存の高品質アシストルールの完全継承】
            - **敬語完全同期**: 相手が敬語なら必ず敬語（です・ます調）で返信。
            - **写真リアクション**: 相手が写真を送ってきた場合、その内容（料理、ペット、風景など）に自然に言及。
            - **神奈川（厚木・茅ヶ崎・湘南・海老名・横浜）限定ルール**: 東京の店は絶対に提案せず、地元近辺で自然に提案。

            ### 🔒 【固定署名キーストアによる直接「更新」】
            - 固定キーストア署名（release.keystore）のため、アンインストール不要でそのまま「更新」可能です。
          files: |
            app/build/outputs/apk/release/line-ai-reply.apk
            app/build/outputs/apk/release/line-ai-reply-v1.6.0.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

