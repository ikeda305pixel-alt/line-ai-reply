name: Build Line AI Reply APK

on:
  push:
    branches:
      - main
      - feat/*
  workflow_dispatch:

jobs:
  build:
    name: Build Line AI Reply APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build with Gradle
        run: |
          gradle assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply.apk
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply-v1.4.2.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: line-ai-reply.apk
          path: app/build/outputs/apk/release/line-ai-reply.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.2
          name: LINE & Bumble AI Reply Assistant v1.4.2 (404完全解消・動的モデル自動検知版)
          body: |
            ## LINE & Bumble AI返信アシスタント v1.4.2 (404エラー完全解消・動的モデル自動検知版)

            ### 🚀 404エラー完全根絶アップデート
            - **動的モデル自動検知（Auto Model Discovery）**:
              APIキーを入力した際、Googleの `ListModels` API を直接照会し、そのユーザーのアカウントで**現時点で実際に有効な最新モデル（gemini-2.5-flash / gemini-2.5-flash-lite / gemini-2.0-flash 等）を完全自動で取得・選択**します。
              これによって、古いモデル名がGoogle側で廃止・非推奨（404 Not Found）になっていても、100%確実に稼働中モデルへ接続されます！
            - **9世代フォールバックモデル配列**:
              万が一のネットワーク一時遮断時にも、`gemini-2.5-flash` から `gemini-pro` までの最新モデルを順次自動試行。
            - **過去ログ学習（ConversationMemoryManager）も完全連動**:
              LINEトーク履歴（.txt）や貼り付けからの過去ログ分析時にも、動的検知された稼働モデルを使用。
            - **通信テストで「利用モデル名」をダイアログ表示**:
              「🔑 APIキーの通信テスト」をタップすると、接続成功した最新モデル名（例: `gemini-2.5-flash`）が明確に確認できます。
            ### 🔧 APIエラー対策＆通信安定化アップデート
            - **APIキー自動サニタイズ**: コピペ時に紛れ込みやすい引用符（"）、前後の改行・空白・全角スペースを自動除去。
            - **キー形式バリデーション＆パスワード可視化トグル**: Google AI Studioのキー（通常 `AIzaSy...`）と異なる場合に親切な確認ダイアログを表示。目玉アイコンで入力内容を目視確認可能。
            - **HTTPエラーコード別の超親切な日本語解説**:
              - HTTP 400: 無効なキー（末尾の欠け、別サービスのキー等）
              - HTTP 403: Google Cloudプロジェクトの権限・API未有効化・地域制限
              - HTTP 429: 無料枠のレート制限（1分置いて再試行）
            - **複数モデル（2.5-flash / 2.0-flash / 1.5-flash）自動フォールバック**: 1つのモデルがビジーやエラーでも自動的に次を試行。
            - **Markdownコードブロック（```json）混入耐性**: AIがコードブロック付きで返答しても100%パースできる堅牢パーサーを搭載。

            ### 過去全ログ学習 ＆ コミュ力プロ × 俺スタイル
            - LINEトーク履歴（.txt）または貼り付けから過去ログを一括学習。
            - 相手の生息エリア（渋谷・恵比寿等）と人間性（わがまま・構ってちゃん等）をプロファイリングし、俺の口調をブレンドして心地よく転がす返信案を生成。
          files: |
            app/build/outputs/apk/release/line-ai-reply.apk
            app/build/outputs/apk/release/line-ai-reply-v1.4.2.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
