name: Build Line AI Reply APK

on:
  push:
    branches:
      - main
      - feat/*
  workflow_dispatch:

jobs:
  build:
    name: Build Line AI Reply APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build with Gradle
        run: |
          gradle assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply.apk
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply-v1.5.3.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: line-ai-reply.apk
          path: app/build/outputs/apk/release/line-ai-reply.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.3
          name: LINE & Bumble AI Reply Assistant v1.5.3 (PayPay完全無干渉・敬語同期・写真リアクション・厚木茅ヶ崎ローカライズ版)
          body: |
            ## LINE & Bumble AI返信アシスタント v1.5.3 (PayPay無干渉・厚木茅ヶ崎生活圏版)

            ### 🛡️ 【PayPay・金融アプリ等への完全無干渉（起動エラーの完全根絶）】
            - **アクセシビリティ監視対象をLINEとBumbleに厳密限定**:
              - `accessibility_service_config.xml` の `android:packageNames` に `jp.naver.line.android,com.bumble.app` を設定。OSレベルでPayPayや銀行アプリの監視・干渉を100%遮断。
            - **能動的Safety Watcherによるオーバーレイ即時完全破棄**:
              - ホーム画面、タスク切り替え、SystemUI、PayPayなどの他アプリへ遷移した瞬間、即座にオーバーレイViewをWindowManagerから物理消去（`removeView`）。
              - さらに300ms間隔の安全コルーチンにより、PayPay起動前に画面上のオーバーレイが1ミリ秒たりとも残らないクリーンな状態を保証します。

            ### 🤝 【Bumble 相手の口調・トーン適応（敬語/タメ口マッチング）】
            - **相手が敬語なら大人の好印象な敬語で返信**:
              - 相手のメッセージが丁寧語（です・ます調、〜でしょうか、〜ですね等）の場合、馴れ馴れしいタメ口を完全禁止。誠実で爽やかな大人の敬語で回答します。
              - 相手がフランク・タメ口なら親しみやすいトーンで同期します。

            ### 📷 【相手の写真送信に対する自然なリアクション】
            - 相手が写真を送ってきたことを検知し、「写真ありがとう！めっちゃ美味しそう！どこ？」「いい景色だね！」「可愛い！」など、写真に対する自然な感想や質問を含めた返信案を生成します。

            ### 📍 【ユーザー生活圏（厚木・茅ヶ崎、神奈川）ローカライズ＆東京提案の完全禁止】
            - **生活拠点を神奈川県（厚木市・茅ヶ崎市・湘南エリア）に完全設定**:
              - 勝手に「渋谷で肉食べよう」「恵比寿のカフェ」など東京を提案することを【完全禁止】にしました。
              - 相手のプロフィールや居住地を踏まえつつ、厚木、本厚木、茅ヶ崎、海老名、辻堂、藤沢、平塚、横浜など、お互いが無理なく会える神奈川エリア基準の提案を行います。

            ### 🛡️ 【固定署名キーストアによる直接「更新」】
            - アプリのアンインストール不要で、そのまま「更新」を押すだけで即座にアップデート完了。
          files: |
            app/build/outputs/apk/release/line-ai-reply.apk
            app/build/outputs/apk/release/line-ai-reply-v1.5.3.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

