name: Build Line AI Reply APK

on:
  push:
    branches:
      - main
      - feat/*
  workflow_dispatch:

jobs:
  build:
    name: Build Line AI Reply APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build with Gradle
        run: |
          gradle assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/line-ai-reply.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: line-ai-reply.apk
          path: app/build/outputs/apk/debug/line-ai-reply.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: LINE & Bumble AI Reply Assistant v1.2.0
          body: |
            ## LINE & Bumble AI返信アシスタント v1.2.0 (対話ディベート反映・空間話者分離＆4ペルソナ即答エンジン)

            ### 最善会話アーキテクチャの全面実装
            - **空間座標による左右話者判定（Speaker Attribution）**:
              画面横幅とバウンディングボックス（Rect）から「相手の発言（左）」と「自分の発言（右）」を厳密に分離。時系列（上から下）の対話ラリーをAIに供給。
            - **質問へのド直球回答（Direct Answer First）**:
              相手の質問（時間・場所・料理・予定）をスルーする「浅い定型文」を完全禁止。選択肢1（🎯 即答）で必ず具体的・明確な回答を提示。
            - **4ペルソナ返信バリエーション**:
              1. 🎯 【即答・ストレート】: 具体的・確定的な回答
              2. 🤝 【共感・ノリ合わせ】: 感情やテンションに寄り添う返答
              3. 😄 【ツッコミ・軽快ユーモア】: 短くクスッと笑えるウィットな返し
              4. 🚀 【次の提案・お誘い / 📲 LINEへ移行】: 具体的な行動を一歩進める提案
            - **トーン＆マナー完全同調 ＆ AI禁止構文フィルター**:
              相手のタメ口/敬語、語尾、絵文字のノリに同調。「お疲れ様です」「ご連絡ありがとうございます」などのAI構文を完全追放。
            - **文脈感知型フォールバック**:
              万が一のオフライン時でも、相手の発話インテントに即した自然な返信候補を提示。
          files: app/build/outputs/apk/debug/line-ai-reply.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
