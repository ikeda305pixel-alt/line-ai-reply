name: Build Line AI Reply APK

on:
  push:
    branches:
      - main
      - feat/*
  workflow_dispatch:

jobs:
  build:
    name: Build Line AI Reply APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build with Gradle
        run: |
          gradle assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply.apk
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/line-ai-reply-v1.5.5.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: line-ai-reply.apk
          path: app/build/outputs/apk/release/line-ai-reply.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.5
          name: LINE & Bumble AI Reply Assistant v1.5.5 (厳格検品合格版・東京提案完全根絶＆キーボード連動＆Bumbleプロフ独立キャッシュ)
          body: |
            ## LINE & Bumble AI返信アシスタント v1.5.5 (厳格検品修正版)

            ### 🎯 【厳格検品による修正・改良点】
            1. **東京（渋谷・恵比寿・新宿等）提案の完全根絶**:
               - 定型文フォールバックやサンプルフレーズに残存していた「渋谷か恵比寿あたり」を完全削除。
               - 神奈川エリア（本厚木・海老名・茅ヶ崎・辻堂・藤沢・横浜）のみに完全統一。
            2. **相手の生息地「全員厚木・茅ヶ崎扱い」バグの解消**:
               - 相手プロファイルのデフォルト生活圏を「不明」に修正。
               - 会話やBumbleプロフで場所が判明していない相手には「生息: ...」を表示せず、性格タイプのみをクリーンに表示。
            3. **キーボード表示中のバブル自動隠蔽を完全動作化**:
               - `AccessibilityWindowInfo.TYPE_INPUT_METHOD` によるOSレベルのソフトキーボード検知を実装。文字入力中はバブルが自動退避し、キーボードを閉じると再出現します。
               - バックグラウンド監視ループを `Dispatchers.Default` に逃がし、LINE/BumbleのUIカクつき・重さを解消。
            4. **Bumbleプロフィール画面での独立キャッシュ**:
               - トーク外（プロフ画面）でも相手の自己紹介・居住地情報を確実に読み込み、相手ごとに個別マップで分離管理（別マッチ相手との情報混同を防止）。
            5. **敬語判定＆写真検知の精密化**:
               - 「よろしくー！」などのタメ口や「クリスマス」などの部分一致を敬語誤検知しないよう正規表現を強化。
               - 「写真立て買った」などの日常会話で写真リアクションが誤発動しないようマーカー判定を厳格化。フォールバックでも写真リアクション＆敬語返信に対応。

            ### 🛡️ 【固定署名キーストアによる直接「更新」】
            - 固定キーストア署名のため、旧バージョンをアンインストールせずそのまま「更新」可能です。
          files: |
            app/build/outputs/apk/release/line-ai-reply.apk
            app/build/outputs/apk/release/line-ai-reply-v1.5.5.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

